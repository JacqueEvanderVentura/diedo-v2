name: Frontend CI

on:
  push:
    branches: [full-stack]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api-backend
          VITE_DEMO_SEED_ENABLED: 'false'
          VITE_FEATURE_SELF_BOOKING: 'false'
          VITE_FEATURE_INVITATIONS: 'false'
          VITE_FEATURE_CRM_DISCOVERY: 'false'
          VITE_FEATURE_PAYROLL: 'false'
          VITE_FEATURE_PERFORMANCE: 'false'
          VITE_FEATURE_NOTIFICATIONS: 'false'
          VITE_FEATURE_CALENDAR_SCHEDULES: 'false'
          VITE_FEATURE_REGIONAL_MODULES: 'false'
        run: npm run build

      # cloudflareConfig.test.js validates the generated, versioned assets.
      - name: Run tests
        run: npm test

      - name: Validate Wrangler deploy plan
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --env production
