name: Reusable Backend CI

on:
  workflow_call:

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Ruff format
        run: python -m ruff format --check app tests

      - name: Type check
        run: python -m mypy app

      - name: Validate migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90
