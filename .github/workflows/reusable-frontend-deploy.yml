name: Reusable Frontend Deploy

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api-backend
          VITE_DEMO_SEED_ENABLED: "false"
          VITE_FEATURE_SELF_BOOKING: "true"
          VITE_FEATURE_INVITATIONS: "true"
          VITE_FEATURE_CRM_DISCOVERY: "true"
          VITE_FEATURE_PAYROLL: "false"
          VITE_FEATURE_PERFORMANCE: "true"
          VITE_FEATURE_NOTIFICATIONS: "true"
          VITE_FEATURE_CALENDAR_SCHEDULES: "true"
          VITE_FEATURE_REGIONAL_MODULES: "true"
          VITE_FEATURE_CHAT: "true"
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Validate Wrangler plan
        env:
          ENV_NAME: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: |
          node scripts/prepare-deploy.mjs
          npx wrangler deploy --dry-run --config .wrangler.deploy.json --env $ENV_NAME

      - name: Deploy to Cloudflare (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler.deploy.json --env preview

      - name: Deploy to Cloudflare (production)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/full-stack'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler.deploy.json --env production

      - name: Verify deployed frontend and Railway connection
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEPLOY_URL: ${{ github.event_name == 'pull_request' && 'https://diedo-frontend-preview.helios360erp.workers.dev' || 'https://diedo-frontend-production.helios360erp.workers.dev' }}
        run: node scripts/check-hosting.mjs "$DEPLOY_URL"

      - name: Verify custom domain when enabled
        if: github.event_name != 'pull_request' && vars.CLOUDFLARE_CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
        run: node scripts/check-hosting.mjs "https://$CUSTOM_DOMAIN"
