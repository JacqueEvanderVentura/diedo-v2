services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - erp_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  postgres_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  erp_pg:
